name: Build NetBox image

on:
  push:
    branches: [master]
  pull_request:
  # Wöchentlicher Rebuild: holt OS-/Security-Fixes im Basis-Image
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/netbox-plugins

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NetBox-Version aus Dockerfile lesen
        id: version
        run: |
          v=$(sed -nE 's/^FROM[[:space:]]+[^:[:space:]]+:(v[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -n1)
          if [ -z "$v" ]; then echo "::error::NetBox-Version im Dockerfile nicht gefunden"; exit 1; fi
          echo "netbox=$v" >> "$GITHUB_OUTPUT"
          echo "NetBox-Version: $v"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Test-Image bauen (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: netbox-plugins:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test (Plugins laden, Django-Checks)
        run: |
          docker run --rm \
            -e SECRET_KEY=dummydummydummydummydummydummydummydummydummydummy \
            -v "$PWD/configuration/plugins.py:/etc/netbox/config/plugins.py:ro" \
            --entrypoint /opt/netbox/venv/bin/python \
            netbox-plugins:test \
            /opt/netbox/netbox/manage.py check

      - name: Login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # unveränderlich – dieses Tag im Helm-Chart verwenden
            type=raw,value=${{ steps.version.outputs.netbox }}-{{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}
            # wandernd – zeigt immer auf den letzten Build dieser NetBox-Version
            type=raw,value=${{ steps.version.outputs.netbox }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Multi-Arch bauen und pushen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
